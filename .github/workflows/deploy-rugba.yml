name: Deploy Rugba Leeg 86 to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'rugba-leeg-86/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rugba-leeg-86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rugba-leeg-86/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-bundle-size.mjs
      # Requires repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit)
      # and CLOUDFLARE_ACCOUNT_ID.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: rugba-leeg-86
